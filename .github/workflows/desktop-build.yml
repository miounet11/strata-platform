name: Stratat Desktop (Win + Mac + Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

env:
  # The client fork lives here. `apps/desktop` is the previous launcher and is no longer shipped.
  CLIENT_DIR: apps/client-upstream
  DESKTOP_DIR: apps/client-upstream/desktop

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The host UI is built first: tauri.conf.json points frontendDist at ../../host/dist.
      - name: Install and build the host UI
        working-directory: ${{ env.CLIENT_DIR }}/host
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Tauri CLI
        working-directory: ${{ env.DESKTOP_DIR }}
        run: npm ci

      - name: Build the app
        working-directory: ${{ env.DESKTOP_DIR }}
        env:
          CI: true
        run: npx tauri build --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            ${{ env.DESKTOP_DIR }}/src-tauri/target/**/release/bundle/**/*
            ${{ env.DESKTOP_DIR }}/src-tauri/target/**/release/latest.json

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true

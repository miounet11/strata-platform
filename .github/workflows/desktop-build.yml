name: Stratat Desktop (Win + Mac + Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

env:
  # The client fork lives here. `apps/desktop` is the previous launcher and is no longer shipped.
  CLIENT_DIR: apps/client-upstream
  DESKTOP_DIR: apps/client-upstream/desktop

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The tag is what users see on the release; Cargo.toml is what lands in the binary.
      # A mismatch ships a build whose updater will keep offering itself again.
      - name: Check tag matches the client version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#desktop-v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' "${{ env.DESKTOP_DIR }}/src-tauri/Cargo.toml" | head -1)
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies $tag_version but Cargo.toml says $cargo_version"
            exit 1
          fi
          echo "version $cargo_version matches the tag"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Build inputs the bundle ships but does not commit: the private Node runtime and the
      # harness/control folders. Without them `tauri build` fails on missing resource paths.
      - name: Stage bundled runtime
        working-directory: ${{ env.DESKTOP_DIR }}
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            x86_64-pc-windows-msvc) node_target=win-x64 ;;
            aarch64-apple-darwin)   node_target=darwin-arm64 ;;
            x86_64-apple-darwin)    node_target=darwin-x64 ;;
            x86_64-unknown-linux-gnu) node_target=linux-x64 ;;
          esac
          bash scripts/fetch-node.sh --target "$node_target"
          for d in harness control engine-bundle; do
            mkdir -p "src-tauri/resources/$d"
            [ -f "src-tauri/resources/$d/.gitignore" ] || printf '*\n!.gitignore\n' > "src-tauri/resources/$d/.gitignore"
          done

      # The host UI is built first: tauri.conf.json points frontendDist at ../../host/dist.
      - name: Install and build the host UI
        working-directory: ${{ env.CLIENT_DIR }}/host
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # libappindicator3-dev and libayatana-appindicator3-dev conflict on Ubuntu 22.04
      # (the former is the deprecated name of the latter), so install only the ayatana one.
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            libgtk-3-dev libayatana-appindicator3-dev

      - name: Install Tauri CLI
        working-directory: ${{ env.DESKTOP_DIR }}
        run: npm ci

      # The updater private key never lives in the repo: it is a repository secret.
      # Losing it means shipped builds can no longer verify our updates.
      # Signing is opt-in: `signingIdentity` in tauri.conf.json names a certificate that only
      # exists on the release Mac. On CI it must come from a secret, or be skipped entirely.
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          node -e '
            const fs = require("fs");
            const p = "src-tauri/tauri.conf.json";
            const id = process.env.APPLE_SIGNING_IDENTITY;
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.bundle.macOS = c.bundle.macOS ?? {};
            if (id) {
              c.bundle.macOS.signingIdentity = id;
              console.log("signing as:", id);
            } else {
              // The identity in the repo names a certificate that only exists on the release
              // Mac; bundling here would fail unless we drop it.
              delete c.bundle.macOS.signingIdentity;
              console.log("::notice::APPLE_SIGNING_IDENTITY not set — unsigned macOS build");
            }
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
          '

      - name: Build the app
        working-directory: ${{ env.DESKTOP_DIR }}
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            # No updater key means no signed update payload. Build the installer anyway so the
            # release still ships, and say so loudly instead of failing on a missing secret.
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set — building without updater signatures"
            npx tauri build --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            npx tauri build --target ${{ matrix.target }}
          fi

      - name: Assert the updater manifest was produced
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "::notice::skipping updater manifest check (no signing key configured)"
            exit 0
          fi
          found=$(find "${{ env.DESKTOP_DIR }}/src-tauri/target" -name 'latest.json' -print -quit)
          if [ -z "$found" ]; then
            echo "::error::tauri did not emit latest.json — check bundle.createUpdaterArtifacts and TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          fi
          echo "updater manifest: $found"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            ${{ env.DESKTOP_DIR }}/src-tauri/target/**/release/bundle/**/*
            ${{ env.DESKTOP_DIR }}/src-tauri/target/**/release/latest.json

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # A CI build without the signing secrets produces unsigned installers. Publishing those
      # over an existing signed release would silently replace a good artifact with a worse one,
      # so the release step refuses unless signing was actually configured.
      - name: Refuse to publish unsigned installers over a signed release
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::signing secrets are not configured; publish from the release machine instead"
            exit 1
          fi
          echo "signing configured — publishing"

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true

[package]
name = "strata-desktop"
version = "0.1.0"
description = "Strata Desktop launcher"
authors = ["Strata Platform"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
open = "5"

[lib]
name = "strata_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

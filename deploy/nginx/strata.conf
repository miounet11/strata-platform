# Apex → www (HTTP + HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name stratat.com strata.com;
    return 301 https://www.stratat.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stratat.com strata.com;
    ssl_certificate /etc/nginx/ssl/stratat.crt;
    ssl_certificate_key /etc/nginx/ssl/stratat.key;
    return 301 https://www.stratat.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.stratat.com www.strata.com;
    return 301 https://www.stratat.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.stratat.com www.strata.com;

    ssl_certificate /etc/nginx/ssl/stratat.crt;
    ssl_certificate_key /etc/nginx/ssl/stratat.key;

    # Hashed build assets. Serving them here keeps CSS/JS up when standalone
    # was rebuilt without the static copy, or while www is restarting.
    location /_next/static/ {
        alias /opt/stratat/apps/www/.next/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /downloads/ {
        alias /var/www/strata-downloads/;
        add_header Cache-Control "public, max-age=3600";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.strata.com;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.strata.com;

    ssl_certificate /etc/nginx/ssl/stratat.crt;
    ssl_certificate_key /etc/nginx/ssl/stratat.key;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

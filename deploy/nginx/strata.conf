# Apex → www (HTTP + HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name stratat.com strata.com;
    return 301 https://www.stratat.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stratat.com strata.com;
    ssl_certificate /etc/nginx/ssl/stratat.crt;
    ssl_certificate_key /etc/nginx/ssl/stratat.key;
    return 301 https://www.stratat.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.stratat.com www.strata.com;
    return 301 https://www.stratat.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.stratat.com www.strata.com;

    ssl_certificate /etc/nginx/ssl/stratat.crt;
    ssl_certificate_key /etc/nginx/ssl/stratat.key;

    include /etc/nginx/snippets/strata-analytics.conf;

    # Hashed build assets. Serving them here keeps CSS/JS up when standalone
    # was rebuilt without the static copy, or while www is restarting.
    location /_next/static/ {
        alias /opt/stratat/apps/www/.next/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # model-fit: published to every site in the fleet. nginx serves it from disk
    # because the standalone server only registers public files at build time.
    location ~ ^/(model-fit\.html|model-fit\.png|data/model-fit\.json)$ {
        root /opt/stratat/apps/www/public;
        access_log off;
        add_header Cache-Control "public, max-age=3600";
    }

    # Root-level icon probes. These used to fall through to the app, where a missing
    # file became Next's 404 page carrying s-maxage; Cloudflare cached it and replayed
    # the 404 to every browser and crawler (6843 hits in 14 days). Answer them from
    # nginx with 204: no page, no app hit, no cached error, bounded cache.
    location ~ ^/(favicon\.ico|favicon\.svg|icon\.ico|icon\.png|apple-touch-icon\.png|apple-touch-icon-precomposed\.png|\.well-known/traffic-advice)$ {
        access_log off;
        add_header Cache-Control "public, max-age=86400";
        return 204;
    }

    # Retired community detail URLs. The community snapshot was pruned (412 issues kept),
    # but crawlers still hold the old sitemap and re-fetch ~2k issue/PR numbers daily:
    # 62,512 404s in 14 days. A 404 invites a retry; 410 Gone + noindex makes them drop it.
    # Only numeric detail pages match — the list pages (/issues, /pulls) and valid entries
    # (which return 200) are untouched, since proxy_intercept_errors only rewrites errors.
    location ~ ^/(en|zh|ja|de|fr|es|pt)/(issues|pulls)/[0-9]+/?$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_intercept_errors on;
        error_page 404 = @community_gone;
    }

    location @community_gone {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=86400" always;
        default_type text/plain;
        return 410 "Gone";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /downloads/ {
        alias /var/www/strata-downloads/;
        add_header Cache-Control "public, max-age=3600";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.strata.com;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.strata.com;

    ssl_certificate /etc/nginx/ssl/stratat.crt;
    ssl_certificate_key /etc/nginx/ssl/stratat.key;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Include inside the stratat.com server block:
#
#   include /etc/nginx/snippets/strata-analytics.conf;
#
# Why it exists: `/var/log/nginx/access.log` on this host is shared by six sites and records
# `$remote_addr`, which behind Cloudflare is a Cloudflare edge IP — one day of traffic showed
# 1,837 distinct "visitors" that were all edges. Neither number says anything about people.
# The daily report needs (a) only this site's requests and (b) one line per real visitor.

# Cloudflare's published edge ranges. `real_ip_header CF-Connecting-IP` is only honoured for
# requests that arrive from an address in these ranges, so a client cannot spoof its way into the
# visitor count by sending the header itself. Refresh from https://www.cloudflare.com/ips/.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;

# Separate file so this site's traffic is separable from the other five. `strata_analytics` is
# declared in /etc/nginx/conf.d/strata-logformat.conf (log_format is http-context only).
access_log /var/log/nginx/strata-access.log strata_analytics;

# Log format for stratat.com, used by /etc/nginx/snippets/strata-analytics.conf.
#
# Install at /etc/nginx/conf.d/strata-logformat.conf — `log_format` is only valid in the `http`
# context, which is exactly where `include /etc/nginx/conf.d/*.conf` sits.
#
# JSON with a fixed field order so the daily report can read it without guessing:
#   t       request time (ISO 8601)
#   ip      visitor address, after Cloudflare real-IP recovery
#   method  GET / HEAD / …
#   uri     path without the query string — the unit the report groups by
#   status  HTTP status
#   bytes   response body size
#   referer Referer header, "-" when absent
#   ua      User-Agent, the only thing that separates a person from a crawler here
#   cf_ray  Cloudflare request id, useful when correlating with an edge log
#
# Why a custom format at all: the default combined log on this host is shared by six sites and
# records a Cloudflare edge IP in the client field, so neither "how many people" nor "how many
# came to stratat.com" could be answered from it.
log_format strata_analytics escape=json
  '{"t":"$time_iso8601",'
  '"ip":"$remote_addr",'
  '"method":"$request_method",'
  '"uri":"$uri",'
  '"status":$status,'
  '"bytes":$body_bytes_sent,'
  '"referer":"$http_referer",'
  '"ua":"$http_user_agent",'
  '"cf_ray":"$http_cf_ray"}';
